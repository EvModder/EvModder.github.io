<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÉvModder</title>
    <meta name="description" content="ÉvModder's project portfolio — Minecraft plugins and more" />
    <meta name="author" content="ÉvModder" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="canonical" href="https://evmodder.net/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

    <meta property="og:title" content="ÉvModder" />
    <meta property="og:description" content="ÉvModder's project portfolio — Minecraft plugins and more" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
    <script>
      (() => {
        let dark = matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          const theme = localStorage.getItem("theme");
          if (theme === "light" || theme === "dark") dark = theme === "dark";
        } catch {}
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
